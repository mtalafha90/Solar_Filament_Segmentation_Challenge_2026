# Default training configuration for FilaNet on MAGFiLO.
#
# Override any value on the command line, for example:
#   python scripts/train.py --config configs/default.yaml --epochs 80
#
# Paths are left blank on purpose: point them at your copy of the data.

annotations: ""            # path to the MAGFiLO COCO JSON
image_dir: ""              # directory holding the GONG observations
cache_dir: "data/cache"    # preprocessed frames are cached here after epoch 1
output_dir: "runs/filanet"

# Data split
val_fraction: 0.15
seed: 0

# Patch sampling.
# Filaments cover well under one per cent of the disk, so most crops are centred
# on an annotated filament. The remaining 30% are drawn uniformly and are what
# teach the model to reject sunspots and plage.
# 512 suits full-resolution GONG frames, whose solar radius is about 900 px.
# Never downsample the frame to fit the network: barbs are a few pixels wide and
# do not survive it.
patch_size: 512
batch_size: 4
samples_per_epoch: 2000
positive_fraction: 0.7
num_workers: 4

# Optimisation
epochs: 60
learning_rate: 0.0003
weight_decay: 0.0001
warmup_epochs: 2
grad_clip: 1.0
amp: true

# Weight on the positive class inside the cross-entropy term. Filaments cover
# about 0.75% of the disk in MAGFiLO, which is a harsh imbalance, so this is set
# from that. scripts/inspect_data.py suggests a value from your own data: raise
# it if the model under-segments, lower it if it floods the disk.
pos_weight: 11.6

# Validation runs on whole disks with the same post-processing a submission
# would use, and the best threshold is stored alongside the checkpoint so that
# prediction needs no manual calibration.
#
# Dice is the primary quantitative overlap criterion in the published challenge
# evaluation. PQ remains reported as a useful diagnostic for splitting and
# merging, but is not the default checkpoint-selection objective.
selection_metric: dice
val_every: 1
val_tile: 512          # whole-disk validation is tiled at this size
val_max_images: 32     # cap on frames scored per epoch
instance_thresholds: 2 # thresholds the costly instance diagnostics run at

# Memory the in-memory observation cache may use, shared across DataLoader
# workers. A prepared 2048-pixel frame is about 110 MB, so a plain count would
# mean something quite different at each resolution.
cache_budget_gb: 3.0

model:
  # MAGFiLO has about 700 distinct observations, which is little to learn
  # general image features from. A pretrained encoder starts with edges and
  # textures already represented and is the single largest improvement
  # available; "scratch" reverts to the original from-scratch encoder.
  encoder: resnet34
  pretrained: true

  in_channels: 2           # flattened intensity + heliocentric-angle geometry
  base_width: 32
  depth: 4                 # four downsamplings; ignored for pretrained encoders
  edge_channels: 32
  n_heads: 8
  dropout: 0.0
  deep_supervision: true
  aux_heads: true
  edge_attention: true

loss:
  bce: 1.0
  tversky: 1.0
  cl_dice: 1.0             # sweep this on real MAGFiLO; topology/area trade-off
  focal: 0.5
  spine: 0.5
  boundary: 0.5
  deep: 0.4
